<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHOOOM — effects for photos and videos</title>
<script>try{var t=localStorage.getItem('shooom.theme');if(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
/* ---------- shadcn/ui tokens · style: Vega ---------- */
:root{
  --background:oklch(1 0 0);
  --foreground:oklch(0.145 0 0);
  --card:oklch(1 0 0);
  --card-foreground:oklch(0.145 0 0);
  --popover:oklch(1 0 0);
  --popover-foreground:oklch(0.145 0 0);
  --primary:oklch(0.525 0.223 3.958);
  --primary-foreground:oklch(0.971 0.014 343.198);
  --secondary:oklch(0.967 0.001 286.375);
  --secondary-foreground:oklch(0.21 0.006 285.885);
  --muted:oklch(0.97 0 0);
  --muted-foreground:oklch(0.556 0 0);
  --accent:oklch(0.97 0 0);
  --accent-foreground:oklch(0.205 0 0);
  --destructive:oklch(0.577 0.245 27.325);
  --border:oklch(0.922 0 0);
  --input:oklch(0.922 0 0);
  --ring:oklch(0.708 0 0);
  --chart-1:oklch(0.865 0.127 207.078);
  --chart-2:oklch(0.715 0.143 215.221);
  --chart-3:oklch(0.609 0.126 221.723);
  --chart-4:oklch(0.52 0.105 223.128);
  --chart-5:oklch(0.45 0.085 224.283);
  --radius:0.875rem;
  --sidebar:oklch(0.985 0 0);
  --sidebar-foreground:oklch(0.145 0 0);
  --sidebar-primary:oklch(0.592 0.249 0.584);
  --sidebar-primary-foreground:oklch(0.971 0.014 343.198);
  --sidebar-accent:oklch(0.97 0 0);
  --sidebar-accent-foreground:oklch(0.205 0 0);
  --sidebar-border:oklch(0.922 0 0);
  --sidebar-ring:oklch(0.708 0 0);

  --success:oklch(0.696 0.17 162.48);
  --radius-sm:calc(var(--radius) - 4px);
  --radius-md:calc(var(--radius) - 2px);
  --radius-lg:var(--radius);
  --radius-xl:calc(var(--radius) + 4px);
  --font-sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-heading:"Lora",ui-serif,Georgia,serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow-xs:0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-sm:0 1px 3px 0 rgb(0 0 0 / .1),0 1px 2px -1px rgb(0 0 0 / .1);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1);
  --ring-soft:color-mix(in oklch,var(--ring) 50%,transparent);
  --btn-outline:var(--background);
  --btn-outline-hover:var(--accent);
  color-scheme:light;
}
.dark{
  --background:oklch(0.145 0 0);
  --foreground:oklch(0.985 0 0);
  --card:oklch(0.205 0 0);
  --card-foreground:oklch(0.985 0 0);
  --popover:oklch(0.205 0 0);
  --popover-foreground:oklch(0.985 0 0);
  --primary:oklch(0.459 0.187 3.815);
  --primary-foreground:oklch(0.971 0.014 343.198);
  --secondary:oklch(0.274 0.006 286.033);
  --secondary-foreground:oklch(0.985 0 0);
  --muted:oklch(0.269 0 0);
  --muted-foreground:oklch(0.708 0 0);
  --accent:oklch(0.269 0 0);
  --accent-foreground:oklch(0.985 0 0);
  --destructive:oklch(0.704 0.191 22.216);
  --border:oklch(1 0 0 / 10%);
  --input:oklch(1 0 0 / 15%);
  --ring:oklch(0.556 0 0);
  --sidebar:oklch(0.205 0 0);
  --sidebar-foreground:oklch(0.985 0 0);
  --sidebar-primary:oklch(0.656 0.241 354.308);
  --sidebar-primary-foreground:oklch(0.971 0.014 343.198);
  --sidebar-accent:oklch(0.269 0 0);
  --sidebar-accent-foreground:oklch(0.985 0 0);
  --sidebar-border:oklch(1 0 0 / 10%);
  --sidebar-ring:oklch(0.556 0 0);
  --shadow-lg:0 10px 30px -6px rgb(0 0 0 / .5),0 4px 10px -4px rgb(0 0 0 / .4);
  --btn-outline:color-mix(in oklch,var(--input) 30%,transparent);
  --btn-outline-hover:color-mix(in oklch,var(--input) 50%,transparent);
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
html,body{margin:0;height:100%;background:var(--background);color:var(--foreground);font:400 14px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3{font-family:var(--font-heading);font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
svg.i{flex:none;pointer-events:none}
::selection{background:color-mix(in oklch,var(--primary) 25%,transparent)}
:focus-visible{outline:none}
button:focus-visible,input:focus-visible{box-shadow:0 0 0 3px var(--ring-soft);border-color:var(--ring)}

/* ---------- button ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border:1px solid var(--border);background:var(--btn-outline);color:var(--foreground);
  border-radius:var(--radius-md);font-size:14px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow-xs);transition:background-color .15s,color .15s,box-shadow .15s,opacity .15s;user-select:none}
.dark .btn{border-color:var(--input)}
.btn:hover{background:var(--btn-outline-hover);color:var(--accent-foreground)}
.btn.accent{background:var(--primary);border-color:transparent;color:var(--primary-foreground)}
.btn.accent:hover{background:color-mix(in oklch,var(--primary) 90%,transparent);color:var(--primary-foreground)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-icon{width:36px;height:36px;display:inline-grid;place-items:center;border:0;background:none;border-radius:var(--radius-md);color:var(--foreground);transition:background-color .15s}
.btn-icon:hover{background:var(--accent);color:var(--accent-foreground)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:16px;height:56px;padding:0 16px;border-bottom:1px solid var(--border);flex:none;background:var(--background);position:relative;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font:700 19px/1 var(--font-heading);letter-spacing:-.01em;user-select:none}
.logo .mark{width:30px;height:30px;border-radius:var(--radius-md);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center}
.logo small{font:500 12px/20px var(--font-sans);letter-spacing:0;height:22px;padding:0 8px;border-radius:999px;background:var(--secondary);color:var(--secondary-foreground);display:inline-flex;align-items:center}
.file{flex:1;min-width:0;color:var(--muted-foreground);font-size:13px;white-space:nowrap;overflow:hidden;display:flex;gap:8px;align-items:center;padding-left:8px}
.file b{color:var(--foreground);font-weight:500;overflow:hidden;text-overflow:ellipsis;min-width:0}
.file .led{width:8px;height:8px;border-radius:50%;background:var(--border);flex:none}
.file.live .led{background:var(--success);box-shadow:0 0 0 3px color-mix(in oklch,var(--success) 20%,transparent)}
.file.live span{flex:none;height:22px;display:inline-flex;align-items:center;padding:0 8px;border:1px solid var(--border);border-radius:999px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;align-items:center}

/* ---------- layout ---------- */
.app{flex:1;display:grid;grid-template-columns:380px minmax(0,1fr);min-height:0}
.stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;
  background:radial-gradient(circle at 1px 1px,var(--border) 1px,transparent 1.3px) 0 0/20px 20px,var(--background)}
.viewport{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:48px 40px 40px;min-height:0}
.frame{position:relative;max-width:100%;max-height:100%;display:flex;line-height:0}
.frame canvas{max-width:100%;max-height:100%;width:auto;height:auto;display:block;border-radius:var(--radius-lg);box-shadow:0 0 0 1px var(--border),var(--shadow-lg);image-rendering:auto}
.badge{position:absolute;left:2px;top:-28px;line-height:1;font-size:12px;color:var(--muted-foreground);white-space:nowrap;font-variant-numeric:tabular-nums}
.badge b{color:var(--foreground);font-weight:500}
.frame.bypass::after{content:"Original";position:absolute;right:12px;top:12px;line-height:22px;height:22px;padding:0 10px;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font-size:12px;font-weight:500;box-shadow:var(--shadow-sm)}

/* empty state / dropzone */
.empty{position:absolute;inset:40px;border:2px dashed var(--border);border-radius:var(--radius-xl);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;
  background:color-mix(in oklch,var(--background) 70%,transparent);transition:border-color .2s,background-color .2s}
.empty .ico{width:56px;height:56px;border-radius:999px;background:var(--muted);color:var(--muted-foreground);display:grid;place-items:center;margin-bottom:4px}
.empty h1{font-size:clamp(32px,4.6vw,56px);line-height:1.05;letter-spacing:-.025em;margin:0}
.empty h1 em{color:var(--primary);font-weight:500}
.dark .empty h1 em{color:var(--sidebar-primary)}
.empty p{color:var(--muted-foreground);margin:0;max-width:440px;line-height:1.6}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
body.drag .empty{border-color:var(--primary);background:color-mix(in oklch,var(--primary) 6%,var(--background))}

/* transport + stage bar */
.transport,.stagebar{display:flex;align-items:center;gap:8px;padding:0 16px;height:52px;border-top:1px solid var(--border);background:var(--background);flex:none}
.transport{gap:12px}
.transport .tbtn{width:32px;height:32px;border:0;background:none;border-radius:var(--radius-md);display:grid;place-items:center;color:var(--foreground);transition:background-color .15s}
.transport .tbtn:hover{background:var(--accent)}
.transport .tbtn.off{color:var(--muted-foreground)}
.time{color:var(--muted-foreground);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stagebar .sp{flex:1}
.ghost{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;background:var(--btn-outline);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--foreground);font-size:13px;font-weight:500;box-shadow:var(--shadow-xs);
  transition:background-color .15s,color .15s;user-select:none;-webkit-user-select:none;touch-action:none}
.dark .ghost{border-color:var(--input)}
.ghost:hover{background:var(--btn-outline-hover)}
.ghost.on{color:var(--primary-foreground);background:var(--primary);border-color:transparent}

/* tabs */
.seg{display:inline-flex;align-items:center;height:32px;padding:3px;gap:2px;background:var(--muted);border-radius:var(--radius-lg)}
.seg button{height:100%;padding:0 10px;background:none;border:1px solid transparent;border-radius:var(--radius-md);color:var(--muted-foreground);font-size:13px;font-weight:500;white-space:nowrap;transition:color .15s,background-color .15s,box-shadow .15s}
.seg button:hover{color:var(--foreground)}
.seg button.on{color:var(--foreground);background:var(--background);box-shadow:var(--shadow-sm)}
.dark .seg button.on{background:color-mix(in oklch,var(--input) 30%,transparent);border-color:var(--input)}

/* slider */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer;--v:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(var(--primary),var(--primary)) 0/var(--v) 100% no-repeat,var(--muted)}
input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:linear-gradient(var(--primary),var(--primary)) 0/var(--v) 100% no-repeat,var(--muted)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:#fff;border:1px solid var(--primary);box-shadow:var(--shadow-sm);transition:box-shadow .15s}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:1px solid var(--primary);box-shadow:var(--shadow-sm)}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--ring-soft)}
input[type=range]:hover::-moz-range-thumb,input[type=range]:active::-moz-range-thumb{box-shadow:0 0 0 4px var(--ring-soft)}
input[type=range]:focus-visible{box-shadow:none}
#scrub{flex:1}

/* ---------- sidebar panel ---------- */
.panel{order:-1;border-right:1px solid var(--sidebar-border);background:var(--sidebar);color:var(--sidebar-foreground);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
/* sections: header + scrollable body; heights are user-adjustable via .split handles */
.sec{display:flex;flex-direction:column;flex:0 1 auto;min-height:48px;overflow:hidden;padding:12px 16px 0}
.sec>.sec-b{flex:1 1 auto;min-height:0;overflow:auto;margin:0 -16px;padding:2px 16px 14px}
.sec.grow{flex:1 1 0;min-height:140px}
.sec.grow>.sec-b{padding-bottom:28px}
.sec-h{flex:none;display:flex;align-items:center;gap:8px;height:28px;margin-bottom:6px;font-size:12px;font-weight:500;color:color-mix(in oklch,var(--sidebar-foreground) 70%,transparent)}
.split{flex:none;height:1px;background:var(--sidebar-border);position:relative;cursor:row-resize;z-index:2;touch-action:none}
.split::before{content:"";position:absolute;inset:-5px 0}
.split::after{content:"";position:absolute;left:50%;top:50%;width:36px;height:4px;border-radius:999px;background:var(--border);transform:translate(-50%,-50%);transition:background-color .15s,width .15s}
.split:hover,.split.on,.split:focus-visible{background:var(--ring)}
.split:hover::after,.split.on::after,.split:focus-visible::after{background:var(--ring);width:48px}
.split:focus-visible{outline:none}
body.resizing,body.resizing *{cursor:row-resize!important;user-select:none!important}
.sec-h b{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--secondary);color:var(--secondary-foreground);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.sec-h .link{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;background:none;border:0;border-radius:var(--radius-md);color:var(--muted-foreground);font-size:12px;font-weight:500}
.sec-h .link:hover{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
.presets{display:flex;gap:6px;overflow-x:auto;align-content:flex-start}
.sec.sized .presets{flex-wrap:wrap;overflow-x:hidden}
.chip{flex:none;height:30px;padding:0 12px;border:1px solid var(--border);background:var(--btn-outline);border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow-xs);transition:background-color .15s,border-color .15s,color .15s}
.dark .chip{border-color:var(--input)}
.chip:hover{border-color:color-mix(in oklch,var(--primary) 50%,transparent);background:color-mix(in oklch,var(--primary) 8%,var(--background))}
.library{display:flex;flex-direction:column;gap:8px}
.lib-g{display:grid;grid-template-columns:68px 1fr;gap:8px;align-items:start}
.lib-g>div{display:flex;flex-wrap:wrap;gap:4px}
.lib-g span{color:var(--muted-foreground);font-size:12px;font-weight:500;line-height:28px}
.lib-g button{height:28px;padding:0 10px 0 8px;border:0;background:var(--secondary);color:var(--secondary-foreground);border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;transition:background-color .15s,color .15s}
.lib-g button::before{content:"+";margin-right:5px;color:var(--muted-foreground);font-weight:400}
.lib-g button:hover{background:var(--primary);color:var(--primary-foreground)}
.lib-g button:hover::before{color:inherit}

/* ---------- stack / card ---------- */
.stack{display:flex;flex-direction:column;gap:8px}
.stack>*,.library>*{flex:none}
.stack-empty{color:var(--muted-foreground);border:1px dashed var(--border);border-radius:var(--radius-lg);padding:28px 16px;text-align:center;line-height:1.6;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:10px}
.stack-empty .ico{width:40px;height:40px;border-radius:999px;background:var(--muted);display:grid;place-items:center}
.stack-empty b{color:var(--foreground);font-weight:500;font-size:14px}
.card{border:1px solid var(--border);background:var(--card);color:var(--card-foreground);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);overflow:hidden;animation:in .25s ease-out both;transition:opacity .15s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card.off{opacity:.55}
.card-h{display:flex;align-items:center;gap:8px;height:46px;padding:0 6px 0 12px;cursor:pointer;user-select:none}
.card-h .n{color:var(--muted-foreground);font-size:12px;width:18px;font-variant-numeric:tabular-nums}
.card-h .nm{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-h .ib{width:28px;height:28px;border:0;background:none;color:var(--muted-foreground);display:grid;place-items:center;border-radius:var(--radius-md);transition:background-color .15s,color .15s}
.card-h .ib:hover{color:var(--accent-foreground);background:var(--accent)}
.card-h .ib[data-a=del]:hover{color:var(--destructive);background:color-mix(in oklch,var(--destructive) 10%,transparent)}
/* switch */
.sw{width:32px;height:18px;border:1px solid transparent;border-radius:999px;background:var(--input);position:relative;padding:0;flex:none;box-shadow:var(--shadow-xs);transition:background-color .15s}
.dark .sw{background:color-mix(in oklch,var(--input) 80%,transparent)}
.sw::after{content:"";position:absolute;top:0;left:0;width:16px;height:16px;border-radius:50%;background:var(--background);transition:transform .15s}
.dark .sw::after{background:var(--foreground)}
.sw.on{background:var(--primary)}
.sw.on::after{transform:translateX(14px)}
.dark .sw.on::after{background:var(--primary-foreground)}
.card-b{padding:14px 14px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--border)}
.card.closed .card-b{display:none}
.prm label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:500;margin-bottom:6px}
.prm label output{color:var(--muted-foreground);font-weight:400;font-variant-numeric:tabular-nums}
.prm .opts{display:flex;flex-wrap:wrap;gap:4px}
.prm .opts button{height:28px;padding:0 10px;border:1px solid var(--border);background:transparent;border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;color:var(--muted-foreground);transition:all .15s}
.dark .prm .opts button{border-color:var(--input)}
.prm .opts button:hover{background:var(--muted);color:var(--foreground)}
.prm .opts button.on{background:var(--primary);border-color:transparent;color:var(--primary-foreground)}
.prm-h{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground);padding-top:8px;margin-bottom:-4px;border-top:1px solid var(--border)}
.prm-h:first-child{border-top:0;padding-top:0}
.card-b>.prm-h:not([hidden])~.prm-h{margin-top:2px}
.prm.inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.prm.inline label{margin:0}
.prm .sel,.prm .txt{width:100%;height:32px;padding:0 10px;border:1px solid var(--input);border-radius:var(--radius-sm);background:var(--btn-outline);color:var(--foreground);font-size:13px;box-shadow:var(--shadow-xs);transition:box-shadow .15s,border-color .15s}
.prm .sel{-webkit-appearance:none;appearance:none;padding-right:30px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 8px center}
.prm .sel option{background:var(--popover);color:var(--popover-foreground)}
.prm .txt{font-family:var(--font-mono);letter-spacing:.04em}
.prm .sel:focus-visible,.prm .txt:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px var(--ring-soft)}
.prm input[type=color]{-webkit-appearance:none;appearance:none;width:44px;height:28px;border:1px solid var(--input);background:var(--btn-outline);padding:3px;border-radius:var(--radius-sm);cursor:pointer;box-shadow:var(--shadow-xs)}
.prm input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.prm input[type=color]::-webkit-color-swatch{border:0;border-radius:6px}
.prm input[type=color]::-moz-color-swatch{border:0;border-radius:6px}

/* ---------- dialog ---------- */
.modal{position:fixed;inset:0;background:rgb(0 0 0 / .5);display:grid;place-items:center;z-index:50;animation:fade .15s ease-out}
.sheet{width:min(480px,calc(100vw - 32px));background:var(--background);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius-xl);padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow-lg);animation:pop .2s ease-out}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.sheet h2{margin:0;font-size:22px;line-height:1.2;letter-spacing:-.01em}
.sheet h2 .ok{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:999px;background:color-mix(in oklch,var(--success) 15%,transparent);color:var(--success);vertical-align:-4px;margin-right:10px}
.sheet .meta{color:var(--muted-foreground);line-height:1.7;margin-top:-8px}
.sheet .meta b{color:var(--foreground);font-weight:500}
.field{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.field input[type=range]{width:100%}
.field>span{font-size:14px;font-weight:500}
.field>span output{color:var(--muted-foreground);font-weight:400}
.field .seg{height:36px}
.bar{height:8px;border-radius:999px;background:color-mix(in oklch,var(--primary) 20%,transparent);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:var(--primary);transition:width .2s}
.prog{display:flex;justify-content:space-between;color:var(--muted-foreground);font-size:13px;font-variant-numeric:tabular-nums}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.note{display:grid;grid-template-columns:16px 1fr;gap:12px;align-items:start;border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 16px;color:var(--muted-foreground);font-size:13px;line-height:1.55;background:var(--card)}
.note svg{margin-top:2px;color:var(--foreground)}

/* ---------- toast (sonner-like) ---------- */
.toast{position:fixed;right:24px;bottom:24px;transform:translateY(16px);background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;font-size:13px;font-weight:500;
  box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;min-width:260px;max-width:min(380px,calc(100vw - 48px))}
.toast.show{opacity:1;transform:none}

@media (max-width:820px){
  body{overflow:auto;height:auto}
  .app{grid-template-columns:minmax(0,1fr)}
  .stage{min-height:0}
  .viewport{flex:none;height:56vh;padding:44px 16px 24px}
  .viewport:has(.empty:not([hidden])){height:auto;min-height:56vh;padding:16px}
  .empty{position:relative;inset:auto;width:100%;padding:32px 16px}
  .empty h1{font-size:clamp(30px,9vw,44px)}
  .top{gap:8px;padding:0 12px}
  .panel{order:0;border-right:0;border-top:1px solid var(--sidebar-border);overflow:visible}
  .split{display:none}
  .sec{height:auto!important;overflow:visible;min-height:0;border-bottom:1px solid var(--sidebar-border)}
  .sec>.sec-b{overflow:visible}
  .sec .presets.sec-b{overflow-x:auto;flex-wrap:nowrap}
  .logo small,.file{display:none}
  .top{justify-content:space-between}
  .actions .btn{padding:0 12px}
  .toast{left:16px;right:16px;bottom:16px;max-width:none;min-width:0}
}
@media (max-width:480px){
  .actions .btn .lbl{display:none}
  .actions .btn{width:36px;padding:0}
  .actions{gap:4px}
  .logo{font-size:17px;gap:8px}
  .stagebar{flex-wrap:wrap;height:auto;min-height:52px;padding:8px 12px}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><span class="mark"><i data-icon="sparkles"></i></span>SHOOOM<small>fx lab</small></div>
  <div class="file" id="fileInfo"><i class="led"></i><span>No file</span></div>
  <div class="actions">
    <button class="btn-icon" id="themeBtn" title="Theme"></button>
    <label class="btn" for="fileInput" title="Open file"><i data-icon="upload"></i><span class="lbl">Open</span></label>
    <input type="file" id="fileInput" accept="image/*,video/*" hidden>
    <button class="btn accent" id="exportBtn" title="Export" disabled><i data-icon="download"></i><span class="lbl">Export</span></button>
  </div>
</header>
<main class="app">
  <section class="stage">
    <div class="viewport" id="viewport">
      <div class="frame" id="frame" hidden>
        <canvas id="cv"></canvas>
        <div class="badge" id="badge"></div>
      </div>
      <div class="empty" id="empty">
        <div class="ico"><i data-icon="image" data-size="24"></i></div>
        <h1>SHOOOM<br><em>noise &amp; glitch</em></h1>
        <p>Drop a photo or video here. Everything runs on your GPU right in the browser: files never leave your device, and exports keep the original resolution.</p>
        <div class="row">
          <label class="btn accent" for="fileInput"><i data-icon="upload"></i>Choose file</label>
          <button class="btn" id="demoBtn"><i data-icon="sparkles"></i>Demo image</button>
        </div>
      </div>
    </div>
    <div class="transport" id="transport" hidden>
      <button class="tbtn" id="playBtn" title="Space"></button>
      <input type="range" id="scrub" min="0" max="1000" step="1" value="0">
      <span class="time" id="time">0:00 / 0:00</span>
      <button class="tbtn" id="muteBtn" title="Sound"></button>
    </div>
    <div class="stagebar">
      <button class="ghost" id="compareBtn" title="Hold, or press \"><i data-icon="contrast"></i>Original</button>
      <button class="ghost" id="seedBtn" title="New random seed for glitch, noise, etc."><i data-icon="shuffle"></i>Seed</button>
      <div class="sp"></div>
      <div class="seg" id="previewSeg" title="Preview quality">
        <button data-v="fast" class="on">Preview</button><button data-v="full">1:1</button>
      </div>
    </div>
  </section>
  <aside class="panel">
    <div class="sec" id="secPresets">
      <div class="sec-h">Presets</div>
      <div class="presets sec-b" id="presets"></div>
    </div>
    <div class="split" data-for="secPresets" role="separator" aria-orientation="horizontal" aria-label="Resize Presets" tabindex="0" title="Drag to resize · double-click to reset"></div>
    <div class="sec" id="secLibrary">
      <div class="sec-h">Add effect</div>
      <div class="library sec-b" id="library"></div>
    </div>
    <div class="split" data-for="secLibrary" role="separator" aria-orientation="horizontal" aria-label="Resize Add effect" tabindex="0" title="Drag to resize · double-click to reset"></div>
    <div class="sec grow" id="secStack">
      <div class="sec-h">Layers <b id="stackCount">0</b><button class="link" id="clearBtn"><i data-icon="trash" data-size="14"></i>Clear</button></div>
      <div class="stack sec-b" id="stack"></div>
    </div>
  </aside>
</main>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<!--APP-->
</body>
</html>
